[[AbstractOperators.stack]]
branch = "fix/reshape-diag-aac"
parent = "fix/compose-getindex-multivar"
pr = "hakkelt/AbstractOperators.jl#10"

[[AbstractOperators.stack]]
branch = "s2-alternate-sign-hoisted-kernel"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#13"

[[AbstractOperators.stack]]
branch = "s3-variation-adjoint-rewrite"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#14"

[[AbstractOperators.stack]]
branch = "c2-cancel-sign-alternation-pair"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#15"

[[AbstractOperators.stack]]
branch = "fix/fftshift-dft-adjoint-dirs-field"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#20"

[[AbstractOperators.stack]]
branch = "fix/nfftop-dcf-contract"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#21"

# `unified-threading` owns the FFTW size policy, and its PR is open against the real upstream, so
# the policy's own bugfix cannot be another commit there -- hence a branch of its own, stacked on
# it, which is what rule 1 above means by "code that no existing branch owns" in practice.
[[AbstractOperators.stack]]
branch = "fix/fftw-thread-gate-planner-flags"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#25"

# MIN_BATCH_WORK_FOR_PARALLEL was never measured (its own docstring called it "provisional");
# swept and raised to its real crossover. unified-threading owns threading_policy.jl and is
# frozen (open against the real upstream), so this is a branch of its own stacked on it, same
# reasoning as the FFTW gate fix above.
[[AbstractOperators.stack]]
branch = "fix/batch-op-threading-threshold"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#26"

# `BroadCast`'s kernels and its threading threshold, both owned by `unified-threading`, which is
# frozen; a branch of its own stacked on it, same reasoning as the two above. Needs the
# `quiesce_foreign_pools` entry point that NestedThreading's `perf/quiesce-foreign-pools` adds,
# so the vendored copy only loads against a NestedThreading checkout that carries it.
[[AbstractOperators.stack]]
branch = "perf/threads-native-kernels"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#27"

# A large `MatrixOp`/`LMatrixOp` `gemm` grants itself BLAS's threads past a caller's soft
# default. Needs NestedThreading's `perf/thread-grants` (0.1.2). Stacked on `unified-threading`,
# which owns `threading_policy.jl` and is frozen.
[[AbstractOperators.stack]]
branch = "perf/blas-flop-grant"
parent = "unified-threading"
pr = ""

# The DFT's normalization pass threads with its plan (FastBroadcast), instead of staying a
# serial full-array pass behind a threaded FFT. `unified-threading` owns the DFT's threading and
# is frozen, so this is a branch of its own stacked on it.
[[AbstractOperators.stack]]
branch = "perf/dft-threaded-scaling"
parent = "unified-threading"
pr = ""

