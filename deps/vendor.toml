[[AbstractOperators.stack]]
branch = "feat/symmetrized-variation"
parent = "fix/compose-getindex-multivar"
pr = "hakkelt/AbstractOperators.jl#8"

[[AbstractOperators.stack]]
branch = "feat/block-hankel-operator"
parent = "fix/compose-getindex-multivar"
