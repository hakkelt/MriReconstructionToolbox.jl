[[AbstractOperators.stack]]
branch = "c6-variation-threading-threshold"
parent = "fix/compose-getindex-multivar"
pr = "hakkelt/AbstractOperators.jl#18"

[[AbstractOperators.stack]]
branch = "nfftop-copy-own-plan"
parent = "fix/compose-getindex-multivar"
pr = "hakkelt/AbstractOperators.jl#19"

[[AbstractOperators.stack]]
branch = "perf/vcat-additive-adjoint"
