# Manifest of the vendored dependency stack.
#
# MRT vendors work-in-progress versions of its dependency stack under `deps/` because a Julia
# package cannot be registered with unregistered dependencies. Every vendored package is a
# projection of a stack of branches in a personal fork, each of which is (or will become) a small
# PR against the real upstream. This file is the single place that records which branches make up
# that projection and how they are stacked, so that `tools/vendor.jl` can rebuild `deps/`
# mechanically and can check the stack against what GitHub actually says.
#
# Per package:
#   fork      remote URL of the personal fork; its `integration` branch is what gets vendored
#   upstream  remote URL of the real upstream
#   base      ref the integration branch is rebuilt from, in the local checkout's remote names
#   prefix    where the package is vendored inside this repository
#   path      local working checkout, where the integration branch is built
#
# Then one `[[<package>.stack]]` entry per branch, in merge order: a branch always appears after
# the branch it is stacked on. `parent` is the branch this one is based on, empty for a branch
# that sits directly on `base`; it is the PR base that the stack intends, which `tools/vendor.jl
# check` compares against the base GitHub reports. Branches may be stacked freely -- stacking is
# how the stack avoids a permanent rebase treadmill, not a defect.
#
# Two rules govern edits to this file:
#
#  1. A branch is a unit of review, not a unit of work. Do not add a branch for a bugfix; push the
#     fix to the branch whose PR introduced the code, and it reaches `deps/` on the next sync. A
#     new entry is for a new idea, or for code that no existing branch owns.
#  2. `deps/` is generated output. Bugs found while developing MRT are fixed on the owning branch
#     and re-vendored, never edited in place under `deps/`.
#
# When a branch's PR merges upstream, delete its entry, re-fetch `base`, and rebuild: everything
# stacked above it moves onto the new root in one go.

[AbstractOperators]
fork = "https://github.com/hakkelt/AbstractOperators.jl.git"
upstream = "https://github.com/kul-optec/AbstractOperators.jl.git"
base = "upstream/master"
prefix = "deps/AbstractOperators"
path = "/project/c_mrrecon/AbstractOperators"

# The root of the stack: a large change already under review upstream, and the first thing that
# will land. Every other branch in this repository should be based on it, so that they all rebase
# onto the new upstream master together when it merges.
[[AbstractOperators.stack]]
branch = "unified-threading"
parent = ""
pr = "kul-optec/AbstractOperators.jl#44"

