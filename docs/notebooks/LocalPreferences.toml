[MRITestData]
download_path = "cache"

# HostCPUFeatures is listed in this project's [deps] only so that this section resolves: Julia
# maps a LocalPreferences section name to a UUID through the active project's dependencies, so a
# preference for a package that is only an indirect dependency is silently ignored.
#
# The packages are precompiled once (on a login node, or on whichever compute node ran
# run_precompile_slurm.sh) and then executed on whatever node SLURM allocates. When those CPUs
# differ, HostCPUFeatures finds its build-time CPU info stale and, with runtime invalidation off,
# prints "Runtime invalidation was disabled, but the CPU info is out-of-date" into the first cell
# of every notebook and proceeds with the wrong CPU name. Allowing the invalidation lets it
# correct itself at load time instead: a one-off recompilation cost in exchange for correct
# vector widths and no warning in the exported HTML.
[HostCPUFeatures]
allow_runtime_invalidation = true
